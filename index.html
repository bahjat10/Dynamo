<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ئیشەکانمان">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F3; --card:#FFFFFF; --ink:#14222B; --mute:#5E6E78; --line:#D5DCE0;
  --head:#12343B; --copper:#B87333; --single:#2F6F9F; --danger:#B3261E; --ok:#2E7D4F; --warn:#B26A00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Vazirmatn",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;padding-bottom:96px}
header{background:var(--head);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:22px;font-weight:800}
.count{font-size:14px;opacity:.8}
.mode{margin-top:8px;font-size:13px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.12)}
.mode.shared{background:rgba(46,125,79,.35)}
.bsum{margin-top:6px;font-size:14px;font-weight:600}
.tools{max-width:720px;margin:12px auto 0;padding:0 16px}
.search{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff}
select.search{margin-top:10px}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.chip.on{background:var(--head);border-color:var(--head);color:#fff}
.list{max-width:720px;margin:12px auto 0;padding:0 16px;display:grid;gap:12px}
.item{background:var(--card);border-radius:14px;display:flex;gap:12px;padding:10px;cursor:pointer;border:1px solid var(--line);align-items:stretch}
.item:active{background:#F6F8F9}
.thumb{width:88px;min-height:88px;border-radius:10px;background:#DDE3E7 center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--mute);font-size:28px}
.info{flex:1;min-width:0}
.badge{display:inline-block;font-size:13px;font-weight:700;color:#fff;padding:1px 10px;border-radius:6px;background:var(--head);margin-left:4px}
.badge.single{background:var(--single)} .badge.three{background:var(--copper)}
.badge.st-open{background:var(--warn)} .badge.st-unpaid{background:var(--danger)} .badge.st-paid{background:var(--ok)}
.specs{margin-top:4px;font-weight:600;font-size:15px}
.ltr{direction:ltr;text-align:right}
.meta{color:var(--mute);font-size:14px;margin-top:2px}
.price{font-weight:800;color:var(--ok);margin-top:2px}
.price.no{color:var(--danger)}
.empty{text-align:center;color:var(--mute);padding:48px 20px}
.fab{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--copper);color:#fff;border:0;border-radius:999px;padding:16px 28px;font:inherit;font-weight:800;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:6;white-space:nowrap}
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;display:none}
.sheet.open{display:block}
#viewSheet{z-index:20}
#formSheet{z-index:22}
#finSheet{z-index:24}
.bar{background:var(--head);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2}
.bar button{background:none;border:0;color:#fff;font:inherit;font-weight:600;cursor:pointer;padding:4px 8px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
label.l{display:block;font-weight:700;margin:18px 0 6px}
.photo{display:grid;width:100%;aspect-ratio:4/3;border-radius:14px;border:2px dashed var(--line);background:#fff center/cover no-repeat;place-items:center;color:var(--mute);cursor:pointer;text-align:center;overflow:hidden}
.photo span{font-size:15px;font-weight:600}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.photoDel{margin-top:8px;background:none;border:0;color:var(--danger);font:inherit;font-weight:600;cursor:pointer;display:none}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jobs button{padding:14px 8px;border-radius:12px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;color:var(--ink)}
.jobs button.on{background:var(--head);border-color:var(--head);color:#fff}
.jobs button:last-child:nth-child(odd){grid-column:1/-1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{padding:16px 8px;border-radius:12px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer;color:var(--ink)}
.seg button small{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.seg button.on[data-v=single]{border-color:var(--single);background:#E6F0F8;color:var(--single)}
.seg button.on[data-v=three]{border-color:var(--copper);background:#F8EEE3;color:var(--copper)}
.seg button.on[data-v=yes]{border-color:var(--ok);background:#E5F3EA;color:var(--ok)}
.seg button.on[data-v=no]{border-color:var(--danger);background:#FBE9E7;color:var(--danger)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wcount{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wcount button{padding:14px 0;border-radius:12px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:800;font-size:18px;cursor:pointer;color:var(--ink)}
.wcount button.on{background:var(--copper);border-color:var(--copper);color:#fff}
.sub{font-size:14px;color:var(--mute);margin:0 0 8px}
.fld{display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;direction:ltr}
.fld b{padding:0 12px;background:#F2F5F7;align-self:stretch;display:grid;place-items:center;min-width:64px;font-size:15px;border-right:1.5px solid var(--line)}
.fld input{flex:1;border:0;padding:13px 10px;font:inherit;min-width:0;outline:none;background:transparent}
.fld:focus-within{border-color:var(--head)}
.in{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff}
.who{display:flex;gap:10px}
.who button{flex:1;padding:14px;border-radius:12px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer;color:var(--ink)}
.who button.on{background:var(--head);border-color:var(--head);color:#fff}
.share{margin-top:10px;padding:12px 14px;border-radius:12px;background:#F8EEE3;color:#7A4A1C;font-weight:700;display:none}
.save{width:100%;margin-top:26px;padding:16px;border:0;border-radius:14px;background:var(--ok);color:#fff;font:inherit;font-weight:800;font-size:18px;cursor:pointer}
.save:disabled{opacity:.6}
.stack{display:grid;gap:10px;margin-top:14px}
.row2{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;padding:14px;border-radius:12px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer;color:var(--ink);text-align:center;text-decoration:none}
.btn.del{border-color:var(--danger);color:var(--danger)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:800}
.big{width:100%;border-radius:14px;display:block;margin-bottom:12px}
.kv{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kv div{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);gap:12px}
.kv div:last-child{border-bottom:0}
.kv span{color:var(--mute);flex:none} .kv strong{direction:ltr;text-align:left}
.kv strong.rt{direction:rtl;text-align:right}
.sumbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700}
.sumbox small{display:block;color:var(--mute);font-weight:400}
.err{color:var(--danger);font-size:14px;margin-top:8px;min-height:20px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-weight:600;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.mbox{background:#fff;border-radius:16px;padding:20px;max-width:360px;width:100%;font-weight:700}
.foot{text-align:center;margin:28px 0}
.foot button{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer}
:focus-visible{outline:3px solid var(--copper);outline-offset:2px}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* ============================================================
   بۆ هاوبەشکردن لەگەڵ باوکت: ئەمە بگۆڕە بە firebaseConfig ی خۆت.
   ئەگەر null بێت، زانیاری تەنها لەم مۆبایلەدا دەمێنێتەوە.
   ============================================================ */
const FIREBASE_CONFIG = null;
/* مەسەلەن:
const FIREBASE_CONFIG = {
  apiKey: "...", authDomain: "...", projectId: "...",
  storageBucket: "...", messagingSenderId: "...", appId: "..."
};
*/

const JOBS = {
  broom:   'گسکی کارەبایی',
  mazakha: 'مزەخەی ماڵان',
  cooler:  'موبەریدە',
  soba:    'سۆبەی کارەبایی',
  washer:  'غەسالە',
  gen:     'تەولید',
  dynamo:  'دینەمۆ'
};
const SIMPLE = ['broom','mazakha','cooler','soba','washer'];
const BAHJAT_RATE = 0.25;

const $ = s => document.querySelector(s);
let motors = [];
let statusF = 'all', jobF = 'all', query = '';
let editing = null, draft = {};
let viewId = null, finId = null, fin = {};

/* ---------- هەڵگرتن ---------- */
let store;
if (FIREBASE_CONFIG && window.firebase) {
  firebase.initializeApp(FIREBASE_CONFIG);
  const col = firebase.firestore().collection('motors');
  store = {
    shared: true,
    listen(cb){ col.orderBy('createdAt','desc').onSnapshot(s => cb(s.docs.map(d => ({...d.data(), id:d.id}))), e => toast('هەڵە لە پەیوەندی: '+e.code)); },
    save(m){ const {id, ...rest} = m; return id ? col.doc(id).set(rest) : col.add(rest); },
    remove(id){ return col.doc(id).delete(); }
  };
} else {
  const K = 'motors_v1';
  const read = () => { try { return JSON.parse(localStorage.getItem(K)) || []; } catch(e){ return []; } };
  let cb = () => {};
  store = {
    shared: false,
    listen(f){ cb = f; cb(read().sort((a,b)=>b.createdAt-a.createdAt)); },
    save(m){
      const all = read();
      if (m.id){ const i = all.findIndex(x=>x.id===m.id); if(i>-1) all[i]=m; else all.push(m); }
      else { m.id = 'm'+Date.now(); all.push(m); }
      try { localStorage.setItem(K, JSON.stringify(all)); } catch(e){ toast('شوێن پڕبووە'); return Promise.reject(e); }
      cb(all.sort((a,b)=>b.createdAt-a.createdAt)); return Promise.resolve();
    },
    remove(id){
      const all = read().filter(x=>x.id!==id);
      try { localStorage.setItem(K, JSON.stringify(all)); } catch(e){ return Promise.reject(e); }
      cb(all); return Promise.resolve();
    }
  };
}

$('#mode').textContent = store.shared ? '✔ هاوبەشە — تۆ و باوکت هەردووکتان دەیبینن' : 'ئێستا تەنها لەم مۆبایلەدا پاشەکەوت دەکرێت';
$('#mode').classList.toggle('shared', store.shared);

/* ---------- یاریدەدەر ---------- */
function toast(t){ const el=$('#toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display='none',2600); }
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = d => d ? d.split('-').reverse().join('/') : '';
const todayStr = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const dateInOf = m => m.dateIn || (m.createdAt ? new Date(m.createdAt - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10) : '');
const money = n => Number(n||0).toLocaleString('en-US') + ' دینار';
const jobOf = m => m.job || 'dynamo';
const statusOf = m => m.status || 'done';            // تۆمارە کۆنەکان وەک تەواوبوو دادەنرێن
const isUnpaid = m => statusOf(m)==='done' && m.paid===false;
const shareOf = m => (statusOf(m)==='done' && m.by==='بهجت' && m.price) ? Math.round(Number(m.price)*BAHJAT_RATE) : 0;
const ufOf = m => (m.type==='single' && m.uf && m.uf!==true) ? m.uf : '';
const typeName = t => t==='single' ? 'Single' : 'Three phase';

function compress(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('read'));
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 900, r = Math.min(1, max/Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg', .72));
      };
      img.onerror = () => rej(new Error('decode'));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function ask(text){
  return new Promise(res => {
    $('#cText').textContent = text; $('#confirmBox').style.display = 'flex';
    const done = v => { $('#confirmBox').style.display = 'none'; res(v); };
    $('#cYes').onclick = () => done(true); $('#cNo').onclick = () => done(false);
  });
}
function pick(groupSel, val){
  document.querySelectorAll(groupSel+' button').forEach(b => b.classList.toggle('on', b.dataset.v===val));
}

/* ---------- فلتەر ---------- */
$('#jobFilter').innerHTML = `<option value="all">هەموو جۆرەکان</option>` +
  Object.entries(JOBS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
$('#jobFilter').onchange = e => { jobF = e.target.value; render(); };
$('#jobs').innerHTML = Object.entries(JOBS).map(([k,v]) => `<button type="button" data-v="${k}">${v}</button>`).join('');

/* ---------- لیست ---------- */
function statusBadge(m){
  if (statusOf(m)==='open') return '<span class="badge st-open">لای ئێمەیە</span>';
  return isUnpaid(m) ? '<span class="badge st-unpaid">پارە نەدراوە</span>' : '<span class="badge st-paid">تەواو</span>';
}
function windLine(m){
  return m.wireCount ? `<div class="meta ltr">${m.wireCount} سیم: ${esc((m.wires||[]).join(' + '))} · ${esc(m.turns)} فڕە</div>` : '';
}
function itemSummary(m){
  const j = jobOf(m);
  if (j==='dynamo'){
    return `<span class="badge ${m.type}">${typeName(m.type)}</span>
      <div class="specs ltr">${esc(m.hp)} Hp · ${esc(m.kw)} Kw · ${esc(m.a)} A · ${esc(m.rpm)} Rpm${ufOf(m)?' · '+esc(ufOf(m))+' UF':''}</div>${windLine(m)}`;
  }
  if (j==='gen'){
    return `<div class="specs ltr">${esc(m.kv)} Kv · ${esc(m.rpm)} Rpm</div><div class="meta">${esc(m.gtype)}</div>${windLine(m)}`;
  }
  return `<div class="specs">${esc(m.desc)}</div>`;
}
function render(){
  $('#count').textContent = motors.length + ' ئیش';
  const total = motors.reduce((s,m)=>s+shareOf(m),0);
  const owed = motors.filter(isUnpaid).reduce((s,m)=>s+Number(m.price||0),0);
  $('#bsum').innerHTML = [
    total ? 'کۆی بەشی بهجت (٢٥٪): ' + money(total) : '',
    owed ? 'پارەی وەرنەگیراو: ' + money(owed) : ''
  ].filter(Boolean).join('<br>');
  const q = query.trim().toLowerCase();
  const rows = motors.filter(m =>
    (statusF==='all' || (statusF==='open' && statusOf(m)==='open') || (statusF==='done' && statusOf(m)==='done') || (statusF==='unpaid' && isUnpaid(m))) &&
    (jobF==='all' || jobOf(m)===jobF) &&
    (!q || (m.owner||'').toLowerCase().includes(q) || (m.by||'').includes(q) || (m.desc||'').toLowerCase().includes(q) || (m.fault||'').toLowerCase().includes(q) || (m.notes||'').toLowerCase().includes(q))
  );
  $('#list').innerHTML = rows.length ? rows.map(m => `
    <div class="item" data-id="${esc(m.id)}">
      <div class="thumb" style="${m.photo?`background-image:url('${m.photo}')`:''}">${m.photo?'':'⚙'}</div>
      <div class="info">
        <span class="badge">${JOBS[jobOf(m)]}</span>${statusBadge(m)}
        ${itemSummary(m)}
        ${m.fault?`<div class="meta">عەیب: ${esc(m.fault)}</div>`:''}
        <div class="meta">${esc(m.owner)}${m.by?' · '+esc(m.by):''}</div>
        <div class="meta">هێنان: ${fmtD(dateInOf(m))}${m.dateDone?' · چاککردن: '+fmtD(m.dateDone):''}</div>
        ${statusOf(m)==='done' && m.price?`<div class="price ${isUnpaid(m)?'no':''}">${money(m.price)}</div>`:''}
      </div>
    </div>`).join('') : `<div class="empty">${motors.length ? 'هیچ شتێک نەدۆزرایەوە' : 'هێشتا هیچ ئیشێک تۆمار نەکراوە.<br>دوگمەی «ئیشی نوێ» دابگرە.'}</div>`;
}
store.listen(list => { motors = list; render(); if (viewId && $('#viewSheet').classList.contains('open')) showView(viewId); });

$('#q').addEventListener('input', e => { query = e.target.value; render(); });
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  statusF = b.dataset.f;
  document.querySelectorAll('#filters .chip').forEach(x=>x.classList.toggle('on', x===b));
  render();
});
$('#list').addEventListener('click', e => { const it = e.target.closest('.item'); if(it) showView(it.dataset.id); });

/* ============================================================
   قۆناغی یەکەم: وەرگرتنی ئامێر
   ============================================================ */
function setPhoto(src){
  const box = $('#photoBox');
  box.style.backgroundImage = src ? `url('${src}')` : '';
  box.innerHTML = src ? '' : '<span>📷 کلیک بکە بۆ وێنە</span>';
  $('#photoDel').style.display = src ? 'inline-block' : 'none';
}
function renderWires(){
  const n = draft.wireCount || 0;
  $('#wireHint').hidden = !n;
  $('#wireFlds').innerHTML = Array.from({length:n}, (_,i) =>
    `<div class="fld"><b>سیم ${i+1}</b><input data-i="${i}" inputmode="decimal" placeholder="mm" value="${esc((draft.wires||[])[i]||'')}"></div>`).join('');
}
function refreshForm(){
  const j = draft.job, dyn = j==='dynamo';
  $('#body').style.display = j ? 'block' : 'none';
  $('#dynBox').style.display = dyn ? 'block' : 'none';
  $('#ufFld').style.display = (dyn && draft.type==='single') ? 'flex' : 'none';
  $('#dynSpecs').style.display = (dyn && draft.type) ? 'block' : 'none';
  $('#genSpecs').style.display = j==='gen' ? 'block' : 'none';
  $('#windBox').style.display = ((dyn && draft.type) || j==='gen') ? 'block' : 'none';
  $('#descBox').style.display = SIMPLE.includes(j) ? 'block' : 'none';
  const ready = j && (!dyn || draft.type);
  $('#common').style.display = ready ? 'block' : 'none';
  $('#save').style.display = ready ? 'block' : 'none';
}
function openForm(id){
  editing = id || null;
  const m = id ? motors.find(x=>x.id===id) : null;
  draft = m ? {...m, job: jobOf(m)} : {job:'', type:'', status:'open', photo:''};
  $('#formTitle').textContent = m ? 'دەستکاریکردن' : 'ئیشی نوێ';
  const set = (sel, v) => $(sel).value = v ?? '';
  set('#hp',draft.hp); set('#kw',draft.kw); set('#a',draft.a);
  set('#rpm', draft.job==='dynamo' ? draft.rpm : ''); set('#rpm2', draft.job==='gen' ? draft.rpm : '');
  set('#uf', typeof draft.uf==='boolean' ? '' : draft.uf);
  set('#kv',draft.kv); set('#gtype',draft.gtype); set('#desc',draft.desc);
  draft.wires = Array.isArray(draft.wires) ? [...draft.wires] : [];
  set('#turns', draft.turns); pick('#wcount', String(draft.wireCount||'')); renderWires();
  set('#fault',draft.fault); set('#owner',draft.owner);
  set('#dateIn', m ? dateInOf(m) : todayStr());
  set('#notes',draft.notes);
  setPhoto(draft.photo); pick('#jobs', draft.job); pick('#typeSeg', draft.type);
  $('#err').textContent=''; refreshForm();
  $('#formSheet').classList.add('open'); $('#formSheet').scrollTop = 0;
}
$('#add').onclick = () => openForm();
$('#closeForm').onclick = () => $('#formSheet').classList.remove('open');
$('#photoIn').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try { draft.photo = await compress(f); setPhoto(draft.photo); }
  catch(_) { toast('وێنەکە نەکرایەوە، وێنەیەکی تر هەڵبژێرە'); }
  e.target.value = '';
};
$('#photoDel').onclick = () => { draft.photo = ''; setPhoto(''); };
$('#jobs').onclick = e => { const b=e.target.closest('button'); if(!b) return; draft.job=b.dataset.v; pick('#jobs', draft.job); refreshForm(); };
$('#typeSeg').onclick = e => { const b=e.target.closest('button'); if(!b) return; draft.type=b.dataset.v; pick('#typeSeg', draft.type); refreshForm(); };
$('#wcount').onclick = e => { const b=e.target.closest('button'); if(!b) return; draft.wireCount=Number(b.dataset.v); pick('#wcount', b.dataset.v); renderWires(); };
$('#wireFlds').addEventListener('input', e => { const i=e.target.dataset.i; if(i!==undefined){ draft.wires = draft.wires||[]; draft.wires[Number(i)] = e.target.value; } });

$('#save').onclick = async () => {
  const get = s => $(s).value.trim();
  const j = draft.job;
  const m = {
    ...draft, job:j, photo:draft.photo||'',
    fault:get('#fault'), owner:get('#owner'), dateIn:get('#dateIn'), notes:get('#notes'),
    status: draft.status || 'open',
    createdAt: draft.createdAt || Date.now(), updatedAt: Date.now()
  };
  if (!m.id) delete m.id;
  if (j==='dynamo'){
    Object.assign(m, {type:draft.type, uf: draft.type==='single' ? get('#uf') : '', hp:get('#hp'), kw:get('#kw'), a:get('#a'), rpm:get('#rpm')});
    if (!m.hp || !m.kw || !m.a || !m.rpm){ $('#err').textContent='تکایە Hp و Kw و A و Rpm پڕ بکەرەوە'; return; }
    if (m.type==='single' && !m.uf){ $('#err').textContent='تکایە UF پڕ بکەرەوە'; return; }
  } else if (j==='gen'){
    Object.assign(m, {kv:get('#kv'), rpm:get('#rpm2'), gtype:get('#gtype')});
    if (!m.kv || !m.rpm || !m.gtype){ $('#err').textContent='تکایە Kv و Rpm و جۆری تەولید پڕ بکەرەوە'; return; }
  } else {
    m.desc = get('#desc');
    if (!m.desc){ $('#err').textContent='جۆری ئیشەکە بنووسە'; return; }
  }
  if (j==='dynamo' || j==='gen'){
    const n = draft.wireCount || 0;
    const wires = Array.from({length:n}, (_,i) => ((draft.wires||[])[i]||'').trim());
    m.turns = get('#turns');
    if (!n){ $('#err').textContent='هەڵبژێرە بە چەند سیم کرایە'; return; }
    if (wires.some(w=>!w)){ $('#err').textContent='سایزی هەموو سیمەکان بنووسە'; return; }
    if (!m.turns){ $('#err').textContent='بنووسە چەند فڕەیە'; return; }
    m.wireCount = n; m.wires = wires;
  }
  if (!m.owner){ $('#err').textContent='ژمارەی خاوەن بنووسە'; return; }
  if (!m.dateIn){ $('#err').textContent='بەرواری هێنان بنووسە'; return; }
  $('#save').disabled = true;
  try {
    await store.save(m);
    $('#formSheet').classList.remove('open');
    toast('پاشەکەوت کرا ✔');
  } catch(e){ $('#err').textContent='پاشەکەوت نەکرا، دووبارە هەوڵبدەوە'; }
  $('#save').disabled = false;
};

/* ============================================================
   قۆناغی دووەم: تەواوکردن، نرخ و پارە
   ============================================================ */
function refreshShare(){
  const el = $('#share');
  const price = Number($('#price').value.replace(/[^\d.]/g,''));
  if (fin.by==='بهجت' && price){
    const s = Math.round(price*BAHJAT_RATE);
    el.style.display = 'block';
    el.textContent = `بەشی بهجت (٢٥٪): ${money(s)} — ماوە: ${money(price-s)}`;
  } else el.style.display = 'none';
}
function openFin(id){
  const m = motors.find(x=>x.id===id); if(!m) return;
  finId = id;
  fin = { by: m.by||'', paid: statusOf(m)==='done' && m.paid!==undefined ? m.paid : null };
  $('#finTitle').textContent = statusOf(m)==='open' ? 'تەواوکردنی ئیش' : 'دەستکاری نرخ و پارە';
  $('#finSum').innerHTML = `${JOBS[jobOf(m)]}<small>${esc(m.owner)} · هێنان: ${fmtD(dateInOf(m))}</small>`;
  $('#price').value = m.price || '';
  $('#dateDone').value = m.dateDone || todayStr();
  pick('#who', fin.by);
  pick('#paidSeg', fin.paid===true ? 'yes' : fin.paid===false ? 'no' : '');
  $('#finErr').textContent = ''; refreshShare();
  $('#finSheet').classList.add('open'); $('#finSheet').scrollTop = 0;
}
$('#closeFin').onclick = () => $('#finSheet').classList.remove('open');
$('#who').onclick = e => { const b=e.target.closest('button'); if(!b) return; fin.by=b.dataset.v; pick('#who', fin.by); refreshShare(); };
$('#paidSeg').onclick = e => { const b=e.target.closest('button'); if(!b) return; fin.paid = b.dataset.v==='yes'; pick('#paidSeg', b.dataset.v); };
$('#price').addEventListener('input', refreshShare);

$('#finSave').onclick = async () => {
  const m = motors.find(x=>x.id===finId); if(!m) return;
  const price = Number($('#price').value.replace(/[^\d.]/g,''))||0;
  const dateDone = $('#dateDone').value;
  const err = t => { $('#finErr').textContent = t; };
  if (!price) return err('نرخ بنووسە');
  if (!fin.by) return err('هەڵبژێرە کێ چاکی کردەوە (بهجت یان جلال)');
  if (!dateDone) return err('بەرواری چاککردن بنووسە');
  if (dateDone < dateInOf(m)) return err('بەرواری چاککردن نابێت پێش بەرواری هێنان بێت');
  if (fin.paid===null) return err('هەڵبژێرە پارەکە واسل کرا یان نا');
  const upd = {...m, status:'done', price, by:fin.by, dateDone, paid:fin.paid, paidDate: fin.paid ? (m.paidDate || todayStr()) : '', updatedAt:Date.now()};
  $('#finSave').disabled = true;
  try { await store.save(upd); $('#finSheet').classList.remove('open'); toast('پاشەکەوت کرا ✔'); }
  catch(e){ err('پاشەکەوت نەکرا، دووبارە هەوڵبدەوە'); }
  $('#finSave').disabled = false;
};

/* ---------- وردەکاری ---------- */
function showView(id){
  const m = motors.find(x=>x.id===id);
  if (!m){ $('#viewSheet').classList.remove('open'); return; }
  viewId = id;
  const j = jobOf(m), st = statusOf(m);
  let rows = `<div><span>دۆخ</span><strong class="rt">${st==='open' ? 'لای ئێمەیە' : (isUnpaid(m) ? 'تەواو بوو — پارە نەدراوە' : 'تەواو بوو — پارە دراوە')}</strong></div>
    <div><span>جۆری ئیش</span><strong class="rt">${JOBS[j]}</strong></div>`;
  if (j==='dynamo'){
    rows += `<div><span>جۆر</span><strong>${typeName(m.type)}</strong></div>
      <div><span>Hp</span><strong>${esc(m.hp)}</strong></div>
      <div><span>Kw</span><strong>${esc(m.kw)}</strong></div>
      <div><span>A</span><strong>${esc(m.a)}</strong></div>
      <div><span>Rpm</span><strong>${esc(m.rpm)}</strong></div>
      ${ufOf(m)?`<div><span>UF</span><strong>${esc(ufOf(m))}</strong></div>`:''}`;
  } else if (j==='gen'){
    rows += `<div><span>Kv</span><strong>${esc(m.kv)}</strong></div>
      <div><span>Rpm</span><strong>${esc(m.rpm)}</strong></div>
      <div><span>جۆری تەولید</span><strong class="rt">${esc(m.gtype)}</strong></div>`;
  } else {
    rows += `<div><span>وەسف</span><strong class="rt">${esc(m.desc)}</strong></div>`;
  }
  if (m.wireCount){
    rows += `<div><span>شێوازی لەفکردن</span><strong class="rt">${m.wireCount} سیم</strong></div>`;
    (m.wires||[]).forEach((w,i) => rows += `<div><span>سایزی سیم ${i+1}</span><strong>${esc(w)}</strong></div>`);
    rows += `<div><span>فڕە</span><strong>${esc(m.turns)}</strong></div>`;
  }
  if (m.fault) rows += `<div><span>عەیب</span><strong class="rt">${esc(m.fault)}</strong></div>`;
  rows += `<div><span>ژمارەی خاوەن</span><strong>${esc(m.owner)}</strong></div>
    <div><span>بەرواری هێنان</span><strong>${fmtD(dateInOf(m))}</strong></div>`;
  if (st==='done'){
    rows += `<div><span>نرخ</span><strong class="rt">${money(m.price)}</strong></div>
      <div><span>چاککەرەوە</span><strong class="rt">${esc(m.by)}</strong></div>`;
    if (m.by==='بهجت') rows += `<div><span>بەشی بهجت (٢٥٪)</span><strong class="rt">${money(shareOf(m))}</strong></div>
      <div><span>ماوە</span><strong class="rt">${money(m.price-shareOf(m))}</strong></div>`;
    if (m.dateDone) rows += `<div><span>بەرواری چاککردن</span><strong>${fmtD(m.dateDone)}</strong></div>`;
    if (m.paid===true && m.paidDate) rows += `<div><span>بەرواری واسلبوون</span><strong>${fmtD(m.paidDate)}</strong></div>`;
  }
  if (m.notes) rows += `<div><span>تێبینی</span><strong class="rt">${esc(m.notes)}</strong></div>`;

  let main = '';
  if (st==='open') main = `<button class="btn go" id="vFin">✔ تەواو بوو و بردرایەوە (نرخ و پارە)</button>`;
  else {
    if (m.paid===false) main += `<button class="btn go" id="vPaid">✔ پارەکە واسل بوو</button>`;
    main += `<button class="btn" id="vFinEdit">دەستکاری نرخ و پارە</button>`;
  }
  $('#viewBody').innerHTML = `
    ${m.photo?`<img class="big" src="${m.photo}" alt="">`:''}
    <div class="kv">${rows}</div>
    <div class="stack">${main}</div>
    <div class="row2">
      ${m.owner?`<a class="btn" href="tel:${esc(m.owner)}">پەیوەندی</a>`:''}
      <button class="btn" id="vEdit">دەستکاری</button>
      <button class="btn del" id="vDel">سڕینەوە</button>
    </div>`;
  $('#viewSheet').classList.add('open');
  $('#vEdit').onclick = () => openForm(id);
  if ($('#vFin')) $('#vFin').onclick = () => openFin(id);
  if ($('#vFinEdit')) $('#vFinEdit').onclick = () => openFin(id);
  if ($('#vPaid')) $('#vPaid').onclick = async () => {
    await store.save({...m, paid:true, paidDate:todayStr(), updatedAt:Date.now()}); toast('پارەکە واسل بوو ✔');
  };
  $('#vDel').onclick = async () => {
    if (!(await ask('دڵنیایت لە سڕینەوەی ئەم تۆمارە؟'))) return;
    try { await store.remove(id); $('#viewSheet').classList.remove('open'); viewId = null; toast('سڕایەوە'); }
    catch(e){ toast('نەسڕایەوە، دووبارە هەوڵبدەوە'); }
  };
}
$('#closeView').onclick = () => { $('#viewSheet').classList.remove('open'); viewId = null; };

/* ---------- یەدەگ ---------- */
$('#export').onclick = () => {
  const data = motors.map(({photo, ...r}) => r);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], {type:'application/json'}));
  a.download = 'backup.json'; a.click();
};
</script>
